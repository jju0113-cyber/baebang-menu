            btnTakeout.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4 mr-1.5 ${reqTakeout ? 'text-green-600' : 'text-gray-400'}"></i> 포장 가능`;
            
            // 예약
            btnReserve.className = `filter-btn flex items-center px-4 py-1.5 rounded-full text-sm font-medium transition-colors border ${reqReserve ? 'bg-blue-50 border-blue-300 text-blue-700' : 'bg-white border-gray-200 text-gray-500 hover:bg-gray-50'}`;
            btnReserve.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4 mr-1.5 ${reqReserve ? 'text-blue-600' : 'text-gray-400'}"></i> 예약 가능`;
            
            lucide.createIcons(); // 아이콘 다시 생성
            renderStores();
        }

        // 이벤트 리스너: 필터 버튼
        document.getElementById('btnRoom').addEventListener('click', () => { reqRoom = !reqRoom; updateFilterButtons(); });
        document.getElementById('btnTakeout').addEventListener('click', () => { reqTakeout = !reqTakeout; updateFilterButtons(); });
        document.getElementById('btnReserve').addEventListener('click', () => { reqReserve = !reqReserve; updateFilterButtons(); });

        // 이벤트 리스너: 검색
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderStores();
        });

        // 3. 매장 그리드 렌더링
        function renderStores() {
            const filteredStores = storeData.filter(store => {
                const matchCategory = activeCategory === "전체" || store.category === activeCategory;
                const matchSearch = store.name.includes(searchQuery) || store.menu.includes(searchQuery);
                const matchRoom = reqRoom ? store.room === 'O' : true;
                const matchTakeout = reqTakeout ? store.takeout === 'O' : true;
                const matchReserve = reqReserve ? store.reserve === 'O' : true;
                
                return matchCategory && matchSearch && matchRoom && matchTakeout && matchReserve;
            });

            document.getElementById('storeCount').innerText = filteredStores.length;

            const grid = document.getElementById('storeGrid');
            const emptyState = document.getElementById('emptyState');

            if (filteredStores.length > 0) {
                grid.style.display = 'grid';
                emptyState.style.display = 'none';
                grid.innerHTML = filteredStores.map(store => `
                    <div onclick="openModal(${store.id})" class="bg-white rounded-2xl p-5 shadow-sm hover:shadow-xl transition-all duration-300 cursor-pointer border border-gray-100 group flex flex-col h-full">
                        <div class="flex justify-between items-start mb-3">
                            <span class="inline-flex items-center text-xs font-bold text-[#8B205D] bg-fuchsia-50 px-2.5 py-1 rounded">
                                <i data-lucide="${getCategoryIconName(store.category)}" class="w-4 h-4 mr-1"></i>
                                ${store.category}
                            </span>
                            <div class="flex gap-1">
                                ${store.room === 'O' ? `<span class="w-2 h-2 rounded-full bg-purple-500" title="룸 완비"></span>` : ''}
                                ${store.takeout === 'O' ? `<span class="w-2 h-2 rounded-full bg-green-500" title="포장 가능"></span>` : ''}
                            </div>
                        </div>
                        
                        <h3 class="text-xl font-bold text-gray-900 mb-2 group-hover:text-[#2C2A5C] transition-colors">${store.name}</h3>
                        <p class="text-sm text-gray-600 font-medium flex-grow">${store.menu}</p>
                        
                        <div class="mt-4 pt-4 border-t border-gray-50 flex items-center text-xs text-gray-400">
                            <i data-lucide="map-pin" class="w-3.5 h-3.5 mr-1"></i>
                            <span class="truncate">${store.address.replace("충남 아산시 ", "")}</span>
                        </div>
                    </div>
                `).join('');
            } else {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                grid.innerHTML = '';
            }

            lucide.createIcons(); // 렌더링 후 아이콘 재생성
        }

        // 4. 모달 제어
        const modal = document.getElementById('detailModal');
        
        function openModal(id) {
            const store = storeData.find(s => s.id === id);
            if(!store) return;

            document.getElementById('modalCategory').innerText = store.category;
            document.getElementById('modalName').innerText = store.name;
            
            const capacityEl = document.getElementById('modalCapacity');
            if(store.capacity && store.capacity !== "-" && store.capacity !== "X") {
                capacityEl.innerText = `수용 가능 인원: ${store.capacity}석`;
                capacityEl.style.display = 'block';
            } else {
                capacityEl.style.display = 'none';
            }

            document.getElementById('modalMenu').innerText = store.menu;
            document.getElementById('modalAddress').innerText = store.address;
            document.getElementById('modalPhone').innerText = store.phone || "전화번호 미기재";
            
            const closedEl = document.getElementById('modalClosed');
            closedEl.innerText = store.closed || "점포 문의";
            closedEl.className = store.closed ? "text-red-500 font-bold" : "";

            // 서비스 태그
            const servicesHtml = `
                <span class="px-3 py-1.5 rounded-lg text-xs font-bold border ${store.takeout === 'O' ? 'bg-green-50 border-green-200 text-green-700' : 'bg-gray-50 border-gray-100 text-gray-400'}">
                    ${store.takeout === 'O' ? '🛍️ 포장 가능' : '포장 불가'}
                </span>
                <span class="px-3 py-1.5 rounded-lg text-xs font-bold border ${store.reserve === 'O' ? 'bg-blue-50 border-blue-200 text-blue-700' : 'bg-gray-50 border-gray-100 text-gray-400'}">
                    ${store.reserve === 'O' ? '📅 예약 가능' : '예약 불가'}
                </span>
                <span class="px-3 py-1.5 rounded-lg text-xs font-bold border ${store.room === 'O' ? 'bg-purple-50 border-purple-200 text-purple-700' : 'bg-gray-50 border-gray-100 text-gray-400'}">
                    ${store.room === 'O' ? '🚪 룸 완비' : '룸 없음'}
                </span>
            `;
            document.getElementById('modalServices').innerHTML = servicesHtml;

            // 액션 버튼
            const actionsHtml = `
                <a 
                    href="${store.phone ? `tel:${store.phone}` : '#'}" 
                    ${!store.phone ? 'onclick="event.preventDefault()"' : ''}
                    class="flex flex-col items-center justify-center py-3.5 rounded-xl transition-all shadow-sm ${store.phone ? 'bg-gray-900 hover:bg-black text-white' : 'bg-gray-100 opacity-50 cursor-not-allowed text-gray-400'}"
                >
                    <i data-lucide="phone" class="w-5 h-5 mb-1.5"></i>
                    <span class="text-xs font-bold">전화걸기</span>
                </a>
                <a 
                    href="https://map.naver.com/v5/search/${encodeURIComponent(store.address)}"
                    target="_blank" rel="noopener noreferrer"
                    class="flex flex-col items-center justify-center py-3.5 rounded-xl bg-[#03C75A] hover:bg-[#02b350] transition-colors text-white shadow-sm"
                >
                    <i data-lucide="navigation" class="w-5 h-5 mb-1.5"></i>
                    <span class="text-xs font-bold">네이버 지도</span>
                </a>
                <a 
                    href="https://map.kakao.com/link/search/${encodeURIComponent(store.address)}"
                    target="_blank" rel="noopener noreferrer"
                    class="flex flex-col items-center justify-center py-3.5 rounded-xl bg-[#FEE500] hover:bg-[#e5ce00] transition-colors text-[#3C1E1E] shadow-sm"
                >
                    <i data-lucide="map-pin" class="w-5 h-5 mb-1.5"></i>
                    <span class="text-xs font-bold">카카오맵</span>
                </a>
            `;
            document.getElementById('modalActions').innerHTML = actionsHtml;

            lucide.createIcons();
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
        }

        // 모달 닫기 이벤트 리스너
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
        });

        // 초기화
        renderCategories();
        renderStores();
        lucide.createIcons();

    </script>
</body>
</html>
